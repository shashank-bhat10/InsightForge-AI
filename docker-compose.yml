services:

  postgres:
    image: postgres:16
    container_name: insightforge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insightforge_ai

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: insightforge-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/insightforge_ai
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

    depends_on:
      - postgres

    ports:
      - "8000:8000"

    volumes:
      - ./backend/uploads:/app/uploads


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: insightforge-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:80"


volumes:
  postgres_data: